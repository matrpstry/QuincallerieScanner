name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install Android SDK
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O android-sdk.zip
        unzip -q android-sdk.zip -d ~/android-sdk
        export ANDROID_HOME=~/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/bin
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null
        sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34"
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools"
        sdkmanager --sdk_root=$ANDROID_HOME "build-tools;34.0.0"
        sdkmanager --sdk_root=$ANDROID_HOME "emulator"

    - name: Set up environment variables
      run: |
        echo "ANDROID_HOME=~/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=~/android-sdk" >> $GITHUB_ENV
        echo "PATH=$PATH:~/android-sdk/cmdline-tools/bin" >> $GITHUB_ENV

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuincallerieScanner-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build Release APK with Gradle
      run: gradle assembleRelease --stacktrace

    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuincallerieScanner-release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 90
